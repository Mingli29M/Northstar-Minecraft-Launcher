# Build & publish EUML for Windows, macOS, and Linux via Tauri.
# Trigger: push to `release`, or Actions → "Run workflow".
#
# Repo Settings → Actions → General → Workflow permissions → Read and write
# (needed so tauri-action can create a draft GitHub Release).
#
# Artifacts land on a draft GitHub Release (tag euml-v__VERSION__).
# Open: https://github.com/Mingli29M/Northstar-Minecraft-Launcher/releases

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # Native Intel runner — cross-compiling x86_64 from ARM breaks
          # objc2-exception-helper build scripts (exit 126 / cannot execute).
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # Keep aarch64 / x86_64 macOS caches separate (same job name otherwise).
          key: ${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: euml-v__VERSION__
          releaseName: EUML v__VERSION__
          releaseBody: |
            Proprietary build — All Rights Reserved.
            Download the installer for your platform from the assets below.

            | Platform | File |
            | --- | --- |
            | Windows | `EUML_*_x64-setup.exe` / `EUML_*_x64_en-US.msi` |
            | macOS Apple Silicon | `EUML_*_aarch64.dmg` |
            | macOS Intel | `EUML_*_x64.dmg` |
            | Linux | `EUML_*_amd64.AppImage` / `.deb` / `.rpm` |

            ### macOS note
            Builds are ad-hoc signed (no Apple Developer ID / notarization yet).
            If macOS says the app is **damaged** and won't open:
            1. Open Terminal
            2. Run: `xattr -cr /Applications/EUML.app` (or the path you installed to)
            3. Right-click the app → **Open**, then confirm

            Or: System Settings → Privacy & Security → allow EUML.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
