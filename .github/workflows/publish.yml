# Build & publish EUML for Windows, macOS, and Linux via Tauri.
# Trigger: push to `release`, or Actions → "Run workflow".
#
# Repo Settings → Actions → General → Workflow permissions → Read and write
# (needed so tauri-action can create a GitHub Release).
#
# macOS signing (permanent Gatekeeper fix):
#   Add these repository secrets to enable Developer ID + notarization:
#     APPLE_CERTIFICATE            — base64 of Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD   — password for that .p12
#     APPLE_SIGNING_IDENTITY       — e.g. "Developer ID Application: … (TEAMID)"
#     APPLE_ID                     — Apple ID email
#     APPLE_PASSWORD               — app-specific password
#     APPLE_TEAM_ID                — 10-char Team ID
#   Without them, macOS builds fall back to ad-hoc signing ("-").
#
# Artifacts: https://github.com/Mingli29M/Northstar-Minecraft-Launcher/releases

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # Native Intel runner — cross-compiling x86_64 from ARM breaks
          # objc2-exception-helper build scripts (exit 126 / cannot execute).
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}

      - name: Install frontend dependencies
        run: npm ci

      # Import Developer ID cert when secrets exist; otherwise ad-hoc ("-").
      # Important: never put empty APPLE_CERTIFICATE into the job env. GitHub
      # resolves missing secrets to "", and Tauri treats a present-but-empty
      # APPLE_CERTIFICATE as "import this .p12", which fails with:
      #   SecKeychainItemImport: One or more parameters ... not valid
      #   failed to import keychain certificate
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            CERT_PATH="${RUNNER_TEMP}/apple-certificate.p12"
            KEYCHAIN_PATH="${RUNNER_TEMP}/euml-signing.keychain-db"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
            else
              IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
              if [ -z "$IDENTITY" ]; then
                echo "Developer ID Application identity not found in imported certificate" >&2
                exit 1
              fi
              echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
            # Export notarization credentials only when present (empty → skip).
            if [ -n "${APPLE_ID:-}" ]; then echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"; fi
            if [ -n "${APPLE_PASSWORD:-}" ]; then echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"; fi
            if [ -n "${APPLE_TEAM_ID:-}" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"; fi
            if [ -n "${APPLE_API_ISSUER:-}" ]; then echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"; fi
            if [ -n "${APPLE_API_KEY:-}" ]; then echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"; fi
            if [ -n "${APPLE_API_KEY_PATH:-}" ]; then echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"; fi
            echo "Mac signing mode: Developer ID (cert imported into temp keychain)"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Mac signing mode: ad-hoc (add APPLE_CERTIFICATE secrets for permanent Gatekeeper fix)"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_SIGNING_IDENTITY / notarization vars are injected via GITHUB_ENV
          # by Configure macOS code signing. Do not map secrets.APPLE_CERTIFICATE*
          # here — missing secrets become "" and break the macOS bundler.
        with:
          tagName: euml-v__VERSION__
          releaseName: EUML v__VERSION__
          releaseBody: |
            # EUML v__VERSION__ — Northstar

            First public release. Proprietary build — All Rights Reserved.

            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows | `EUML_*_x64-setup.exe` / `EUML_*_x64_en-US.msi` |
            | macOS Apple Silicon | `EUML_*_aarch64.dmg` |
            | macOS Intel | `EUML_*_x64.dmg` |
            | Linux | `EUML_*_amd64.AppImage` / `.deb` / `.rpm` |

            Full notes are also in **Settings → About** inside the app.

            ### macOS Gatekeeper

            - **With Apple Developer secrets configured in CI:** builds are Developer ID signed and notarized — open normally.
            - **Ad-hoc fallback (no secrets):** if macOS says the app is damaged, run `xattr -cr /Applications/EUML.app`, then right-click → Open.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
