# Build & publish Northstar for Windows, macOS, and Linux via Tauri.
# Trigger: push to `release`, or Actions → "Run workflow" (any branch).
#
# Repo Settings → Actions → General → Workflow permissions → Read and write
# (needed so tauri-action can create a GitHub Release).
#
# macOS signing (permanent Gatekeeper fix):
#   Add these repository secrets to enable Developer ID + notarization:
#     APPLE_CERTIFICATE            — base64 of Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD   — password for that .p12
#     APPLE_SIGNING_IDENTITY       — e.g. "Developer ID Application: … (TEAMID)"
#     APPLE_ID                     — Apple ID email
#     APPLE_PASSWORD               — app-specific password
#     APPLE_TEAM_ID                — 10-char Team ID
#   Without them, macOS builds fall back to ad-hoc signing ("-").
#
# Artifacts: https://github.com/Mingli29M/Northstar-Minecraft-Launcher/releases

name: publish

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          # Native Intel runner — cross-compiling x86_64 from ARM breaks
          # objc2-exception-helper build scripts (exit 126 / cannot execute).
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Prefetch AppImage bundler tools into Tauri's cache so a flaky GitHub
      # CDN blip during `tauri build` does not fail the whole Linux job with
      # "Connection reset by peer" while downloading linuxdeploy / AppRun.
      - name: Prefetch Linux AppImage bundler tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          CACHE="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$CACHE"
          download() {
            local url="$1" dest="$2"
            if [ -s "$dest" ]; then
              echo "Already present: $dest"
              return 0
            fi
            echo "Downloading $url"
            curl --fail --location --retry 12 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 300 \
              --output "$dest.partial" "$url"
            mv "$dest.partial" "$dest"
            chmod +x "$dest"
          }
          download \
            "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" \
            "$CACHE/AppRun-x86_64"
          download \
            "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage" \
            "$CACHE/linuxdeploy-x86_64.AppImage"
          # Optional GTK plugin script (bundler may fetch if missing).
          download \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" \
            "$CACHE/linuxdeploy-plugin-gtk.sh" || true
          ls -la "$CACHE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust_target || 'native' }}

      - name: Install frontend dependencies
        run: npm ci

      # Import Developer ID cert when secrets exist; otherwise ad-hoc ("-").
      # Important: never put empty APPLE_CERTIFICATE into the job env. GitHub
      # resolves missing secrets to "", and Tauri treats a present-but-empty
      # APPLE_CERTIFICATE as "import this .p12", which fails with:
      #   SecKeychainItemImport: One or more parameters ... not valid
      #   failed to import keychain certificate
      - name: Configure macOS code signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          set -euo pipefail
          # Multiline-safe GITHUB_ENV export (avoids injection on special chars).
          export_env() {
            local name="$1"
            local value="$2"
            {
              echo "${name}<<EOF_NS_ENV"
              printf '%s\n' "$value"
              echo "EOF_NS_ENV"
            } >> "$GITHUB_ENV"
          }
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
            CERT_PATH="${RUNNER_TEMP}/apple-certificate.p12"
            KEYCHAIN_PATH="${RUNNER_TEMP}/northstar-signing.keychain-db"
            echo "$APPLE_CERTIFICATE" | base64 -d > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            rm -f "$CERT_PATH"
            if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
              export_env APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            else
              IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
              if [ -z "$IDENTITY" ]; then
                echo "Developer ID Application identity not found in imported certificate" >&2
                exit 1
              fi
              export_env APPLE_SIGNING_IDENTITY "$IDENTITY"
            fi
            # Export notarization credentials only when present (empty → skip).
            if [ -n "${APPLE_ID:-}" ]; then export_env APPLE_ID "$APPLE_ID"; fi
            if [ -n "${APPLE_PASSWORD:-}" ]; then export_env APPLE_PASSWORD "$APPLE_PASSWORD"; fi
            if [ -n "${APPLE_TEAM_ID:-}" ]; then export_env APPLE_TEAM_ID "$APPLE_TEAM_ID"; fi
            if [ -n "${APPLE_API_ISSUER:-}" ]; then export_env APPLE_API_ISSUER "$APPLE_API_ISSUER"; fi
            if [ -n "${APPLE_API_KEY:-}" ]; then export_env APPLE_API_KEY "$APPLE_API_KEY"; fi
            if [ -n "${APPLE_API_KEY_PATH:-}" ]; then export_env APPLE_API_KEY_PATH "$APPLE_API_KEY_PATH"; fi
            echo "Mac signing mode: Developer ID (cert imported into temp keychain)"
          else
            export_env APPLE_SIGNING_IDENTITY "-"
            echo "Mac signing mode: ad-hoc (add APPLE_CERTIFICATE secrets for permanent Gatekeeper fix)"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_SIGNING_IDENTITY / notarization vars are injected via GITHUB_ENV
          # by Configure macOS code signing. Do not map secrets.APPLE_CERTIFICATE*
          # here — missing secrets become "" and break the macOS bundler.
        with:
          tagName: northstar-v__VERSION__
          releaseName: Northstar v__VERSION__
          releaseBody: |
            # Northstar v__VERSION__

            Proprietary build — All Rights Reserved.

            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows | `Northstar_*_x64-setup.exe` / `Northstar_*_x64_en-US.msi` |
            | macOS Apple Silicon | `Northstar_*_aarch64.dmg` |
            | macOS Intel | `Northstar_*_x64.dmg` |
            | Linux | `Northstar_*_amd64.AppImage` / `.deb` / `.rpm` |

            Full notes are also in **Settings → About** inside the app.

            ### macOS Gatekeeper

            - **With Apple Developer secrets configured in CI:** builds are Developer ID signed and notarized — open normally.
            - **Ad-hoc fallback (no secrets):** if macOS says the app is damaged, run `xattr -cr /Applications/Northstar.app`, then right-click → Open.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
