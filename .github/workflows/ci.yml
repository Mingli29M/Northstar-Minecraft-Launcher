# Fast compile gate so publish is not the first place Linux/macOS build breaks.
# Runs on PRs and pushes to main/release (publish still builds installers separately).

name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

jobs:
  rust-check:
    name: cargo check (ubuntu)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  frontend-build:
    name: frontend build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck + Vite build
        run: npm run build
